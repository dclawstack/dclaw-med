apiVersion: apps/v1
kind: Deployment
metadata:
  name: dclaw-med-backend
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-med-backend
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dclaw-med-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dclaw-med-backend
        app.kubernetes.io/part-of: dclaw-platform
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: docker.io/library/dclaw-med-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8092
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_med"
            - name: APP_ENV
              value: "production"
            - name: CORS_ORIGINS
              value: "*"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dclaw-med-backend
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-med-backend
    app.kubernetes.io/part-of: dclaw-platform
spec:
  type: ClusterIP
  ports:
    - port: 8092
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: dclaw-med-backend

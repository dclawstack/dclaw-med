apiVersion: apps/v1
kind: Deployment
metadata:
  name: dclaw-med
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-med
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dclaw-med
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dclaw-med
        app.kubernetes.io/part-of: dclaw-platform
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/library/dclaw-med:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3004
              protocol: TCP
          env:
            - name: PORT
              value: "3004"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
